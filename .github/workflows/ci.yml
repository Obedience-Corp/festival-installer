name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v4
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Vet the notty lane
        run: go vet -tags notty ./internal/cli/...
      - name: Test
        run: go test ./...
      - name: Prove non-Windows pwsh profile append in a container
        run: just testing pwsh-append-container-proof
      - name: Prove shell completion policy and app tool precedence
        run: just testing shell-integration-container-proof
      - name: Prove root Obey uninstall preserves hooks and receipt
        run: just testing uninstall-root-container-proof
      - name: Prove PowerShell interactive-only integration
        run: |
          CGO_ENABLED=0 go test -c -tags container_fs -o "$RUNNER_TEMP/festival-shellsetup.test" ./internal/shellsetup
          CGO_ENABLED=0 go test -c -tags container_fs -o "$RUNNER_TEMP/festival-pwsh-app.test" ./internal/app
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/festival-pwsh-app.test:/proof:ro" --entrypoint /proof mcr.microsoft.com/powershell:7.4-ubuntu-22.04@sha256:62300a213a9293916333df2b014cd3a8f22fb0b0b65f2bb446aaf436bcf8c868 -test.v -test.run '^TestPwshIntegrationUsesPowerShellDialect$'
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/festival-shellsetup.test:/proof:ro" --entrypoint /proof mcr.microsoft.com/powershell:7.4-ubuntu-22.04@sha256:62300a213a9293916333df2b014cd3a8f22fb0b0b65f2bb446aaf436bcf8c868 -test.v -test.run '^TestPowerShellInteractiveProfileOnly$'
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  portable-builds:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build supported platforms
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/festival-linux-amd64 ./cmd/festival
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/festival-linux-arm64 ./cmd/festival
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o dist/festival-darwin-amd64 ./cmd/festival
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/festival-darwin-arm64 ./cmd/festival
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/festival-windows-amd64.exe ./cmd/festival
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -o dist/festival-windows-arm64.exe ./cmd/festival
      - name: Reject dynamically linked Linux artifacts
        run: |
          file dist/festival-linux-amd64 | grep -q "statically linked"
          file dist/festival-linux-arm64 | grep -q "statically linked"

  windows-command-names:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Windows executable naming
        run: go test ./internal/app -run '^TestProductExecutableNames$' -count=1

  windows-install-container:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v4
      - name: Prove Windows ZIP, lock, transaction, and names in Server Core
        shell: pwsh
        run: just testing windows-install-container-proof

