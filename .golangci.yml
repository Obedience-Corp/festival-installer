version: "2"
run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  exclusions:
    rules:
      - path: doc\.go
        linters:
          - unused
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
